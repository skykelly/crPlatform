name: Refresh Korea Life Fact Base

on:
  workflow_dispatch:
    inputs:
      validate_only:
        description: 'Validate stored data without calling KOSIS'
        type: boolean
        default: false
      probe_api:
        description: 'Check KOSIS request parameters without changing data'
        type: boolean
        default: false
      discover_sources:
        description: 'Search KOSIS tables for missing indicators (writes data/discovery/)'
        type: boolean
        default: false
      probe_candidates:
        description: 'Inspect dimensions of tables in pipeline/candidates.json (writes data/discovery/)'
        type: boolean
        default: false
  schedule:
    # 10th of each month, 09:30 Asia/Seoul (UTC+9, no daylight saving)
    - cron: '30 0 10 * *'

permissions:
  contents: write

concurrency:
  group: factbase-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test ingestion rules
        run: python -m unittest discover -s tests -v
      - name: Validate current database
        run: python pipeline/factbase.py check
      - name: Diagnose KOSIS request parameters
        if: ${{ inputs.probe_api }}
        env:
          KOSIS_API_KEY: ${{ secrets.KOSIS_API_KEY }}
        run: python pipeline/probe_kosis.py
      - name: Discover source tables
        if: ${{ inputs.discover_sources }}
        env:
          KOSIS_API_KEY: ${{ secrets.KOSIS_API_KEY }}
        run: python pipeline/discover_kosis.py
      - name: Probe candidate tables
        if: ${{ inputs.probe_candidates }}
        env:
          KOSIS_API_KEY: ${{ secrets.KOSIS_API_KEY }}
        run: python pipeline/probe_candidate_tables.py
      - name: Publish discovery and probe results
        if: ${{ inputs.discover_sources || inputs.probe_candidates }}
        run: |
          git add data/discovery
          if git diff --cached --quiet; then
            echo 'No discovery output.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'discovery: KOSIS table search and probe results'
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Fetch and validate KOSIS data
        if: ${{ !inputs.validate_only && !inputs.probe_api && !inputs.discover_sources && !inputs.probe_candidates }}
        env:
          KOSIS_API_KEY: ${{ secrets.KOSIS_API_KEY }}
        run: python pipeline/factbase.py refresh
      - name: Fetch and validate additional five-driver series
        if: ${{ !inputs.validate_only && !inputs.probe_api && !inputs.discover_sources && !inputs.probe_candidates }}
        env:
          KOSIS_API_KEY: ${{ secrets.KOSIS_API_KEY }}
        run: python pipeline/extended_facts.py
      - name: Fetch configured official tables (each table independent)
        if: ${{ !inputs.validate_only && !inputs.probe_api && !inputs.discover_sources && !inputs.probe_candidates }}
        env:
          KOSIS_API_KEY: ${{ secrets.KOSIS_API_KEY }}
        run: python pipeline/official_tables.py
      - name: Rebuild web data and validate again
        run: |
          python pipeline/factbase.py check
          python pipeline/dashboard_v3.py
      - name: Publish verified data to GitHub
        if: ${{ !inputs.validate_only && !inputs.probe_api && !inputs.discover_sources && !inputs.probe_candidates }}
        run: |
          git add data/factbase.sqlite data/raw data/discovery archive/korea-life-fact-base-v2/dist/data/dashboard.json
          if git diff --cached --quiet; then
            echo 'No official data changes; nothing to publish.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'data: refresh official Korea life facts'
          git pull --rebase origin main
          git push origin HEAD:main
